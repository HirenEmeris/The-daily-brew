<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>The Daily Brew - Contact</title>
    <!-- Leaflet map styles -->
<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="_css-assets/styles.css">
</head>

<body>

    <header>
        <div class="container">
            <div class="logo">
                <img src="_images/logo.png" alt="The Daily Brew logo" class="logo-img">
                <div>
                    <h1>The Daily Brew</h1>
                    <p class="tagline">Fresh coffee, every day</p>
                </div>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="menu.html">Menu</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="gallery.html">Gallery</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="contact">
        <div class="container">
            <h2 class="section-title">📬 Get In Touch</h2>
            <p class="section-subtitle">We'd love to hear from you</p>

            <form id="contact-form" class="contact-form">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" placeholder="Enter your name">
                </div>
                <div class="form-group">
                    <label for="email">Your Email</label>
                    <input type="email" id="email" placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label for="message">Your Message</label>
                    <textarea id="message" rows="4" placeholder="Tell us what's on your mind..."></textarea>
                </div>
                <button type="submit" class="btn-submit">Send Message</button>
            </form>

            <div id="form-feedback" class="form-feedback"></div>

            <div id="form-feedback" class="form-feedback"></div>
        </div>
    </section>

    <!-- Interactive Map -->
<section class="map-section">
    <div class="container">

        <h2 class="section-title">📍 Find Us</h2>

        <p class="section-subtitle">
            Explore our locations.
        </p>

        <!-- Leaflet will create the map inside this element -->
        <div id="map"
             aria-label="Interactive map showing our locations">
        </div>

    </div>
</section>

    <footer>
        <div class="container">
            <p>&copy; <span id="year"></span> The Daily Brew. All rights reserved.</p>
        </div>
    </footer>
