<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Daily Brew - Menu</title>
    <link rel="stylesheet" href="_css-assets/styles.css">
</head>
<body>

    <header>
        <div class="container">
            <div class="logo">
                <img src="_images/logo.png" alt="The Daily Brew logo" class="logo-img">
                <div>
                    <h1>The Daily Brew</h1>
                    <p class="tagline">Fresh coffee, every day</p>
                </div>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="menu.html">Menu</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="gallery.html">Gallery</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="menu">
        <div class="container">
            <h2 class="section-title">☕ Our Menu</h2>
            <p class="section-subtitle">Handcrafted drinks made with love</p>

            <div class="menu-grid">
                <div class="menu-item">
                    <img src="_images/expresso.png" alt="Espresso">
                    <h3>Espresso</h3>
                    <p class="price">R25</p>
                </div>
                <div class="menu-item">
                    <img src="_images/cappuccino.png" alt="Cappuccino">
                    <h3>Cappuccino</h3>
                    <p class="price">R35</p>
                </div>
                <div class="menu-item">
                    <img src="_images/latte.png" alt="Latte">
                    <h3>Latte</h3>
                    <p class="price">R38</p>
                </div>
                <div class="menu-item">
                    <img src="_images/croissant.png" alt="Croissant">
                    <h3>Croissant</h3>
                    <p class="price">R30</p>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; <span id="year"></span> The Daily Brew. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
